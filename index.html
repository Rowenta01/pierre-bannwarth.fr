document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"background:{{ accent }}; color:#F2EBE0; padding:14px 24px; font-weight:600; font-size:15px;\" style-hover=\"background:#F2EBE0; color:#0D1B3D;\">Lire la tribune ↗<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:20px; border-top:1.5px solid rgba(242,235,224,0.22); padding-top:22px;\">\n        <div><div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:44px; line-height:1;\" data-count=\"15\" data-suffix=\"+\">0<\u002Fdiv><div style=\"font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.6; line-height:1.6; margin-top:4px;\">années de management<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:44px; line-height:1;\" data-count=\"800\" data-suffix=\"\">0<\u002Fdiv><div style=\"font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.6; line-height:1.6; margin-top:4px;\">salariés · déploiement piloté<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:44px; line-height:1;\" data-count=\"6\" data-suffix=\"\">0<\u002Fdiv><div style=\"font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.6; line-height:1.6; margin-top:4px;\">rubriques suivies en écriture<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showPortrait }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:relative; justify-self:center; width:100%; max-width:420px;\">\n        <div style=\"position:absolute; inset:18px -18px -18px 18px; background:{{ accent }};\"><\u002Fdiv>\n        <img src=\"bb707798-2360-4051-bfce-f65ce088a6da\" alt=\"Pierre Bannwarth\" style=\"position:relative; display:block; width:100%; aspect-ratio:4/5; object-fit:cover; object-position:50% 22%; border:2px solid #F2EBE0; filter:grayscale(1) contrast(1.06); transition:filter .6s ease;\" style-hover=\"filter:grayscale(0) contrast(1);\">\n        <div style=\"position:relative; margin-top:14px; display:flex; justify-content:space-between; font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.7;\">\n          <span>Pierre Bannwarth<\u002Fspan><span>Fig. 01<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ showTicker }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:{{ accent }}; color:#F2EBE0; border-bottom:2px solid #0D1B3D; overflow:hidden; padding:12px 0;\">\n    <div style=\"display:flex; width:max-content; animation:admarquee 46s linear infinite; font-family:'Space Mono', monospace; font-size:12.5px; letter-spacing:0.18em; text-transform:uppercase;\">\n      <div style=\"display:flex; gap:26px; padding-right:26px;\"><span>Insertion par l'activité économique<\u002Fspan><span>★<\u002Fspan><span>Économie sociale &amp; solidaire<\u002Fspan><span>★<\u002Fspan><span>Médico-social<\u002Fspan><span>★<\u002Fspan><span>Environnement<\u002Fspan><span>★<\u002Fspan><span>Formation<\u002Fspan><span>★<\u002Fspan><span>Conduite du changement<\u002Fspan><span>★<\u002Fspan><span>Vie privée<\u002Fspan><span>★<\u002Fspan><span>Intelligence artificielle<\u002Fspan><span>★<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:26px; padding-right:26px;\" aria-hidden=\"true\"><span>Insertion par l'activité économique<\u002Fspan><span>★<\u002Fspan><span>Économie sociale &amp; solidaire<\u002Fspan><span>★<\u002Fspan><span>Médico-social<\u002Fspan><span>★<\u002Fspan><span>Environnement<\u002Fspan><span>★<\u002Fspan><span>Formation<\u002Fspan><span>★<\u002Fspan><span>Conduite du changement<\u002Fspan><span>★<\u002Fspan><span>Vie privée<\u002Fspan><span>★<\u002Fspan><span>Intelligence artificielle<\u002Fspan><span>★<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<section id=\"apport\" style=\"padding:clamp(64px,7vw,104px) 28px;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,32px); align-items:start; padding-bottom:26px; border-bottom:3px solid #0D1B3D;\">\n      <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(64px,8vw,120px); line-height:0.8; color:{{ accent }};\">01<\u002Fdiv>\n      <div style=\"padding-top:6px;\">\n        <h2 style=\"margin:0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:0.95; letter-spacing:-0.02em;\">Ce que j'apporte<\u002Fh2>\n        <p style=\"margin:14px 0 0; font-size:clamp(16px,1.4vw,19px); line-height:1.55; max-width:62ch; color:rgba(13,27,61,0.62);\">Je ne me définis pas par une spécialité unique, mais par une manière de travailler. Voici ce qu'elle produit concrètement dans une organisation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit, minmax(288px,1fr)); gap:22px;\">\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); border:2px solid #0D1B3D; background:#F2EBE0; padding:28px; display:flex; flex-direction:column; gap:12px;\" style-hover=\"background:#EBE3D5;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.14em; color:{{ accent }};\">01<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:27px; line-height:1.05;\">Une lecture transversale<\u002Fdiv>\n        <p style=\"margin:0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.66); flex:1;\">Entrer dans des environnements complexes sans se laisser impressionner par leur complexité. Repérer vite les logiques d'acteurs, les contraintes réelles et les leviers.<\u002Fp>\n        <div style=\"border-top:1.5px solid rgba(13,27,61,0.16); padding-top:12px; font-size:14px; line-height:1.5;\"><strong style=\"color:{{ accent }};\">→<\u002Fstrong> Les blocages, les priorités et les marges de manœuvre deviennent lisibles.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); border:2px solid #0D1B3D; background:#F2EBE0; padding:28px; display:flex; flex-direction:column; gap:12px;\" style-hover=\"background:#EBE3D5;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.14em; color:{{ accent }};\">02<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:27px; line-height:1.05;\">Une culture du terrain<\u002Fdiv>\n        <p style=\"margin:0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.66); flex:1;\">Quinze ans dans des structures associatives, sociales, médico-sociales et environnementales. Le réel comme point de départ, toujours.<\u002Fp>\n        <div style=\"border-top:1.5px solid rgba(13,27,61,0.16); padding-top:12px; font-size:14px; line-height:1.5;\"><strong style=\"color:{{ accent }};\">→<\u002Fstrong> Des décisions ajustées aux équipes et aux contraintes quotidiennes.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); border:2px solid #0D1B3D; background:#F2EBE0; padding:28px; display:flex; flex-direction:column; gap:12px;\" style-hover=\"background:#EBE3D5;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.14em; color:{{ accent }};\">03<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:27px; line-height:1.05;\">Une capacité de structuration<\u002Fdiv>\n        <p style=\"margin:0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.66); flex:1;\">Mettre à plat, clarifier les priorités, organiser un projet, construire des outils de suivi — sans perdre l'humanité de l'organisation.<\u002Fp>\n        <div style=\"border-top:1.5px solid rgba(13,27,61,0.16); padding-top:12px; font-size:14px; line-height:1.5;\"><strong style=\"color:{{ accent }};\">→<\u002Fstrong> Des rôles mieux définis, des étapes plus claires.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); border:2px solid #0D1B3D; background:#F2EBE0; padding:28px; display:flex; flex-direction:column; gap:12px;\" style-hover=\"background:#EBE3D5;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.14em; color:{{ accent }};\">04<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:27px; line-height:1.05;\">Une posture pédagogique<\u002Fdiv>\n        <p style=\"margin:0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.66); flex:1;\">En salle de formation, en réunion d'équipe ou dans un texte : rendre les sujets compréhensibles. Une idée n'est utile que lorsqu'elle peut être appropriée.<\u002Fp>\n        <div style=\"border-top:1.5px solid rgba(13,27,61,0.16); padding-top:12px; font-size:14px; line-height:1.5;\"><strong style=\"color:{{ accent }};\">→<\u002Fstrong> Du complexe rendu accessible, appropriable, actionnable.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); border:2px solid #0D1B3D; background:#F2EBE0; padding:28px; display:flex; flex-direction:column; gap:12px;\" style-hover=\"background:#EBE3D5;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.14em; color:{{ accent }};\">05<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:27px; line-height:1.05;\">Un management par la confiance<\u002Fdiv>\n        <p style=\"margin:0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.66); flex:1;\">Donner un cap sans écraser les initiatives. Poser un cadre sans rigidifier. Écouter sans renoncer à décider.<\u002Fp>\n        <div style=\"border-top:1.5px solid rgba(13,27,61,0.16); padding-top:12px; font-size:14px; line-height:1.5;\"><strong style=\"color:{{ accent }};\">→<\u002Fstrong> Des collectifs plus stables, plus capables d'initiative.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); border:2px solid #0D1B3D; background:#F2EBE0; padding:28px; display:flex; flex-direction:column; gap:12px;\" style-hover=\"background:#EBE3D5;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.14em; color:{{ accent }};\">06<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:27px; line-height:1.05;\">Une polyvalence assumée<\u002Fdiv>\n        <p style=\"margin:0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.66); flex:1;\">Faire dialoguer plusieurs mondes : terrain et stratégie, social et organisationnel, numérique et humain. Pas une dispersion — une capacité de lien.<\u002Fp>\n        <div style=\"border-top:1.5px solid rgba(13,27,61,0.16); padding-top:12px; font-size:14px; line-height:1.5;\"><strong style=\"color:{{ accent }};\">→<\u002Fstrong> Anticiper les transformations plutôt que les subir.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ecriture\" style=\"background:#0D1B3D; color:#F2EBE0; padding:clamp(64px,7vw,104px) 28px;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,32px); align-items:start; padding-bottom:26px; border-bottom:3px solid #F2EBE0;\">\n      <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(64px,8vw,120px); line-height:0.8; color:{{ accent }};\">02<\u002Fdiv>\n      <div style=\"padding-top:6px;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.2em; text-transform:uppercase; color:#C8F03A;\">Travail d'auteur · autonomie-digitale.fr<\u002Fdiv>\n        <h2 style=\"margin:10px 0 0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:0.95; letter-spacing:-0.02em;\">J'écris une tribune indépendante<\u002Fh2>\n        <p style=\"margin:14px 0 0; font-size:clamp(16px,1.4vw,19px); line-height:1.55; max-width:64ch; opacity:0.75;\">Pas un blog de formateur en quête de clients. Une tribune écrite depuis une position de terrain — sans sponsor, sans publicité, sans actif à promouvoir.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:clamp(24px,4vw,56px); align-items:start;\">\n      <div>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(28px,3vw,38px); line-height:1.2; letter-spacing:-0.01em;\">«&nbsp;Comprendre les technologies qui conditionnent notre autonomie, pour décider, agir et s'organiser <span style=\"color:#C8F03A;\">avec lucidité<\u002Fspan> — plutôt qu'avec peur ou naïveté.&nbsp;»<\u002Fdiv>\n        <div style=\"margin-top:16px; font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.6;\">— Le manifeste, Autonomie Digitale<\u002Fdiv>\n        <p style=\"margin:26px 0 0; font-size:17px; line-height:1.7; opacity:0.78; max-width:60ch;\">\n          Les organisations qui échouent leur transformation numérique ne manquent pas d'outils. Elles manquent de lucidité sur ce que les outils produisent vraiment&nbsp;: des dépendances, des rapports de pouvoir, des angles morts collectifs. J'écris pour nommer ces effets, avec des faits et des nuances.\n        <\u002Fp>\n        <a href=\"https://autonomie-digitale.fr\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:26px; display:inline-block; background:{{ accent }}; color:#F2EBE0; padding:13px 22px; font-weight:600; font-size:15px;\" style-hover=\"background:#C8F03A; color:#0D1B3D;\">Ouvrir autonomie-digitale.fr ↗<\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:2px; background:rgba(242,235,224,0.22); border:2px solid rgba(242,235,224,0.22);\">\n        <div style=\"background:#0D1B3D; padding:24px;\"><div style=\"font-family:'Space Mono', monospace; font-size:11px; color:{{ accent }};\">01<\u002Fdiv><div style=\"margin-top:8px; font-family:'DM Serif Display', Georgia, serif; font-size:26px;\">Direct<\u002Fdiv><p style=\"margin:8px 0 0; font-size:14.5px; line-height:1.55; opacity:0.7;\">La thèse dès l'introduction. Le lecteur sait en trente secondes ce que le texte défend.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0D1B3D; padding:24px;\"><div style=\"font-family:'Space Mono', monospace; font-size:11px; color:{{ accent }};\">02<\u002Fdiv><div style=\"margin-top:8px; font-family:'DM Serif Display', Georgia, serif; font-size:26px;\">Documenté<\u002Fdiv><p style=\"margin:8px 0 0; font-size:14.5px; line-height:1.55; opacity:0.7;\">Chaque affirmation factuelle est sourcée. Les opinions sont marquées comme telles.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0D1B3D; padding:24px;\"><div style=\"font-family:'Space Mono', monospace; font-size:11px; color:{{ accent }};\">03<\u002Fdiv><div style=\"margin-top:8px; font-family:'DM Serif Display', Georgia, serif; font-size:26px;\">Autonome<\u002Fdiv><p style=\"margin:8px 0 0; font-size:14.5px; line-height:1.55; opacity:0.7;\">Pas de sponsor, pas de partenaire à ménager, pas de ligne idéologique à tenir.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0D1B3D; padding:24px;\"><div style=\"font-family:'Space Mono', monospace; font-size:11px; color:{{ accent }};\">04<\u002Fdiv><div style=\"margin-top:8px; font-family:'DM Serif Display', Georgia, serif; font-size:26px;\">Opérationnel<\u002Fdiv><p style=\"margin:8px 0 0; font-size:14.5px; line-height:1.55; opacity:0.7;\">Chaque texte permet de faire quelque chose de différent après l'avoir lu.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showArticles }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:clamp(40px,5vw,64px);\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; border-top:1.5px solid rgba(242,235,224,0.22); padding-top:22px;\">\n          <div style=\"font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.2em; text-transform:uppercase; opacity:0.6;\">Derniers textes publiés<\u002Fdiv>\n          <a href=\"https://autonomie-digitale.fr\" target=\"_blank\" rel=\"noopener\" style=\"color:#C8F03A; font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase;\">Tout voir →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px; display:grid; grid-template-columns:repeat(auto-fit, minmax(290px,1fr)); gap:22px;\">\n          <a href=\"https://autonomie-digitale.fr/articles/le-jour-ou-se-proteger-est-devenu-une-anomalie-a-justifier/\" target=\"_blank\" rel=\"noopener\" data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); color:#F2EBE0; border:2px solid rgba(242,235,224,0.3); padding:26px; display:flex; flex-direction:column; gap:14px;\" style-hover=\"border-color:#C8F03A;\">\n            <span style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap;\"><span style=\"background:{{ accent }}; color:#F2EBE0; padding:4px 10px; font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.16em;\">DÉCRYPTAGE<\u002Fspan><span style=\"font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.12em; opacity:0.6;\">· DONNÉES · 24 MIN<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'DM Serif Display', Georgia, serif; font-style:italic; font-size:25px; line-height:1.1;\">Vie privée en 2026 : le jour où se protéger est devenu une anomalie à justifier.<\u002Fspan>\n            <span style=\"font-size:14.5px; line-height:1.55; opacity:0.68;\">Analyse du mécanisme, puis guide opérationnel complet, outil par outil, pour reprendre la main.<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://autonomie-digitale.fr/articles/ecologie-interdiction-sans-strategie/\" target=\"_blank\" rel=\"noopener\" data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); color:#F2EBE0; border:2px solid rgba(242,235,224,0.3); padding:26px; display:flex; flex-direction:column; gap:14px;\" style-hover=\"border-color:#C8F03A;\">\n            <span style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap;\"><span style=\"background:{{ accent }}; color:#F2EBE0; padding:4px 10px; font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.16em;\">ANALYSE<\u002Fspan><span style=\"font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.12em; opacity:0.6;\">· NUMÉRIQUE DURABLE<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'DM Serif Display', Georgia, serif; font-style:italic; font-size:25px; line-height:1.1;\">L'écologie qui interdit sans stratégie fabrique de la dépendance, pas de la sobriété.<\u002Fspan>\n            <span style=\"font-size:14.5px; line-height:1.55; opacity:0.68;\">Pourquoi l'interdiction sans alternative organisée déplace le problème au lieu de le traiter.<\u002Fspan>\n          <\u002Fa>\n          <a href=\"https://autonomie-digitale.fr/articles/votre-ordinateur-vous-surveille-linux-non/\" target=\"_blank\" rel=\"noopener\" data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); color:#F2EBE0; border:2px solid rgba(242,235,224,0.3); padding:26px; display:flex; flex-direction:column; gap:14px;\" style-hover=\"border-color:#C8F03A;\">\n            <span style=\"display:flex; gap:8px; align-items:center; flex-wrap:wrap;\"><span style=\"background:{{ accent }}; color:#F2EBE0; padding:4px 10px; font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.16em;\">PRATIQUE<\u002Fspan><span style=\"font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.12em; opacity:0.6;\">· DONNÉES<\u002Fspan><\u002Fspan>\n            <span style=\"font-family:'DM Serif Display', Georgia, serif; font-style:italic; font-size:25px; line-height:1.1;\">Votre ordinateur vous surveille. Linux, non.<\u002Fspan>\n            <span style=\"font-size:14.5px; line-height:1.55; opacity:0.68;\">Ce que collecte un système grand public, et ce que change concrètement une alternative libre.<\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"domaines\" style=\"background:#EBE3D5; padding:clamp(64px,7vw,104px) 28px;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,32px); align-items:start; padding-bottom:26px; border-bottom:3px solid #0D1B3D;\">\n      <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(64px,8vw,120px); line-height:0.8; color:{{ accent }};\">03<\u002Fdiv>\n      <div style=\"padding-top:6px;\">\n        <h2 style=\"margin:0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:0.95; letter-spacing:-0.02em;\">Les domaines traités<\u002Fh2>\n        <p style=\"margin:14px 0 0; font-size:clamp(16px,1.4vw,19px); line-height:1.55; max-width:62ch; color:rgba(13,27,61,0.62);\">Six terrains d'analyse, une même exigence : nommer les effets réels avant de proposer quoi que ce soit. Choisissez une rubrique.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:36px; display:flex; gap:10px; flex-wrap:wrap;\">\n      <sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"5\">\n        <button type=\"button\" sc-camel-on-click=\"{{ d.select }}\" style=\"{{ d.tabStyle }}\">{{ d.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:24px; border:2px solid #0D1B3D; background:#F2EBE0; padding:clamp(26px,3.4vw,44px); display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:clamp(24px,4vw,52px);\">\n      <div>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.2em; text-transform:uppercase; color:rgba(13,27,61,0.55);\">Rubrique {{ activeIndex }} · position de l'auteur<\u002Fdiv>\n        <div style=\"margin-top:14px; font-family:'DM Serif Display', Georgia, serif; font-size:clamp(28px,3.2vw,40px); line-height:1.15; letter-spacing:-0.01em;\">{{ activeQuote }}<\u002Fdiv>\n        <div style=\"margin-top:20px; height:4px; width:120px; background:{{ accent }};\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:30px; line-height:1;\">{{ activeLabel }}<\u002Fdiv>\n        <p style=\"margin:12px 0 0; font-size:17px; line-height:1.65; color:rgba(13,27,61,0.66);\">{{ activeBody }}<\u002Fp>\n        <div style=\"margin-top:22px; border-left:6px solid {{ accent }}; padding-left:18px;\">\n          <div style=\"font-weight:700; font-size:18px;\">Et concrètement ?<\u002Fdiv>\n          <ul style=\"margin:10px 0 0; padding-left:18px; font-size:15.5px; line-height:1.7; color:rgba(13,27,61,0.75);\">\n            <sc-for list=\"{{ activeBullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <li>{{ b }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"parcours\" style=\"padding:clamp(64px,7vw,104px) 28px;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,32px); align-items:start; padding-bottom:26px; border-bottom:3px solid #0D1B3D;\">\n      <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(64px,8vw,120px); line-height:0.8; color:{{ accent }};\">04<\u002Fdiv>\n      <div style=\"padding-top:6px;\">\n        <h2 style=\"margin:0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:0.95; letter-spacing:-0.02em;\">Une trajectoire transversale<\u002Fh2>\n        <p style=\"margin:14px 0 0; font-size:clamp(16px,1.4vw,19px); line-height:1.55; max-width:62ch; color:rgba(13,27,61,0.62);\">Variée au premier regard, structurée par une même question : comment aider une organisation à passer d'un état à un autre sans casser ce qui fonctionne déjà ?<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:32px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;\">\n      <span style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(13,27,61,0.5); margin-right:6px;\">Filtrer<\u002Fspan>\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f.select }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:34px; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:22px;\">\n      <sc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"6\">\n        <div style=\"border-top:4px solid #0D1B3D; padding-top:18px; display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-family:'Space Mono', monospace; font-size:12px; letter-spacing:0.1em;\">\n            <span>{{ t.year }}<\u002Fspan><span style=\"{{ t.tagStyle }}\">{{ t.cat }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:25px; line-height:1.1; margin-top:4px;\">{{ t.role }}<\u002Fdiv>\n          <div style=\"font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.08em; color:rgba(13,27,61,0.55); line-height:1.6;\">{{ t.org }}<\u002Fdiv>\n          <p style=\"margin:6px 0 0; font-size:15.5px; line-height:1.6; color:rgba(13,27,61,0.7);\">{{ t.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"management\" style=\"background:#0D1B3D; color:#F2EBE0; padding:clamp(64px,7vw,104px) 28px;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,32px); align-items:start; padding-bottom:26px; border-bottom:3px solid #F2EBE0;\">\n      <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(64px,8vw,120px); line-height:0.8; color:{{ accent }};\">05<\u002Fdiv>\n      <div style=\"padding-top:6px;\">\n        <h2 style=\"margin:0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:0.95; letter-spacing:-0.02em;\">Manager par la confiance, jamais par le flou<span style=\"color:{{ accent }};\">.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); gap:clamp(24px,4vw,56px); align-items:start;\">\n      <div>\n        <p style=\"margin:0; font-family:'DM Serif Display', Georgia, serif; font-size:clamp(24px,2.6vw,34px); line-height:1.3;\">Le management est un travail d'équilibre. Donner un cap <em style=\"color:#C8F03A;\">sans écraser<\u002Fem> les initiatives. Poser un cadre <em style=\"color:#C8F03A;\">sans rigidifier<\u002Fem>. Écouter <em style=\"color:#C8F03A;\">sans renoncer à décider<\u002Fem>.<\u002Fp>\n        <sc-if value=\"{{ showPortrait }}\" hint-placeholder-val=\"{{ true }}\">\n          <img src=\"856a1e9b-ad4d-4aba-a5ea-96b96845c36a\" alt=\"Pierre Bannwarth\" style=\"margin-top:30px; display:block; width:100%; max-width:340px; aspect-ratio:1/1; object-fit:cover; object-position:50% 25%; border:2px solid #F2EBE0; filter:grayscale(1) contrast(1.06); transition:filter .6s ease;\" style-hover=\"filter:grayscale(0) contrast(1);\">\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:2px; background:rgba(242,235,224,0.22); border:2px solid rgba(242,235,224,0.22);\">\n        <div style=\"background:#0D1B3D; padding:26px;\"><div style=\"font-weight:700; font-size:19px;\">Comprendre les systèmes<\u002Fdiv><p style=\"margin:8px 0 0; font-size:15.5px; line-height:1.6; opacity:0.72;\">Observer avant d'agir. Repérer les personnes, les contraintes, les habitudes, les non-dits — et ce qui fonctionne déjà.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0D1B3D; padding:26px;\"><div style=\"font-weight:700; font-size:19px;\">Structurer sans rigidifier<\u002Fdiv><p style=\"margin:8px 0 0; font-size:15.5px; line-height:1.6; opacity:0.72;\">Mettre à plat, clarifier, organiser — sans transformer le cadre en carcan. Gagner en lisibilité sans perdre en souplesse.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#0D1B3D; padding:26px;\"><div style=\"font-weight:700; font-size:19px;\">Transmettre pour rendre autonome<\u002Fdiv><p style=\"margin:8px 0 0; font-size:15.5px; line-height:1.6; opacity:0.72;\">Décomposer, reformuler, rendre praticable. Une idée n'est utile que lorsqu'elle peut être discutée, adaptée et utilisée.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"formations\" style=\"background:#EBE3D5; padding:clamp(64px,7vw,104px) 28px;\">\n  <div style=\"max-width:1280px; margin:0 auto;\">\n    <div style=\"display:grid; grid-template-columns:auto 1fr; gap:clamp(20px,3vw,32px); align-items:start; padding-bottom:26px; border-bottom:3px solid #0D1B3D;\">\n      <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(64px,8vw,120px); line-height:0.8; color:{{ accent }};\">06<\u002Fdiv>\n      <div style=\"padding-top:6px;\">\n        <h2 style=\"margin:0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(32px,4.4vw,56px); line-height:0.95; letter-spacing:-0.02em;\">Formations dispensées<\u002Fh2>\n        <p style=\"margin:14px 0 0; font-size:clamp(16px,1.4vw,19px); line-height:1.55; max-width:62ch; color:rgba(13,27,61,0.62);\">Interventions en enseignement supérieur, du bachelor au mastère. Approche interdisciplinaire, pédagogie « hors les murs » — la rencontre du terrain comme méthode.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:44px; display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:2px; background:#0D1B3D; border:2px solid #0D1B3D;\">\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); background:#F2EBE0; padding:30px; display:flex; flex-direction:column; gap:10px;\" style-hover=\"background:#C8F03A;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }};\">Mastère 1<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:26px; line-height:1.05;\">Urbanisme durable<\u002Fdiv>\n        <p style=\"margin:0; font-size:15px; line-height:1.6; color:rgba(13,27,61,0.68); flex:1;\">Transition écologique des territoires, arbitrages réels, innovation environnementale et projets à impact.<\u002Fp>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; color:rgba(13,27,61,0.5); border-top:1.5px solid rgba(13,27,61,0.16); padding-top:10px;\">7 × 3h30<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); background:#F2EBE0; padding:30px; display:flex; flex-direction:column; gap:10px;\" style-hover=\"background:#C8F03A;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }};\">Bachelor 3<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:26px; line-height:1.05;\">ESS — structures alternatives<\u002Fdiv>\n        <p style=\"margin:0; font-size:15px; line-height:1.6; color:rgba(13,27,61,0.68); flex:1;\">Entrepreneuriat social, modèles économiques durables, mécénat, logiques de bénéfice réciproque.<\u002Fp>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; color:rgba(13,27,61,0.5); border-top:1.5px solid rgba(13,27,61,0.16); padding-top:10px;\">7 × 3h30<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); background:#F2EBE0; padding:30px; display:flex; flex-direction:column; gap:10px;\" style-hover=\"background:#C8F03A;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }};\">Bachelor 1<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:26px; line-height:1.05;\">Structures associatives<\u002Fdiv>\n        <p style=\"margin:0; font-size:15px; line-height:1.6; color:rgba(13,27,61,0.68); flex:1;\">Introduction à l'ESS, modèles et impacts, gouvernance, leadership et management dans l'associatif.<\u002Fp>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; color:rgba(13,27,61,0.5); border-top:1.5px solid rgba(13,27,61,0.16); padding-top:10px;\">7 × 3h30<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); background:#F2EBE0; padding:30px; display:flex; flex-direction:column; gap:10px;\" style-hover=\"background:#C8F03A;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }};\">Bachelor 3<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:26px; line-height:1.05;\">Vie privée et technologie<\u002Fdiv>\n        <p style=\"margin:0; font-size:15px; line-height:1.6; color:rgba(13,27,61,0.68); flex:1;\">Données personnelles, réseaux sociaux, traçabilité, impact des technologies émergentes sur les droits.<\u002Fp>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; color:rgba(13,27,61,0.5); border-top:1.5px solid rgba(13,27,61,0.16); padding-top:10px;\">6 × 3h30<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-rv=\"\" style=\"opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); background:#F2EBE0; padding:30px; display:flex; flex-direction:column; gap:10px;\" style-hover=\"background:#C8F03A;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:{{ accent }};\">Mastère<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:26px; line-height:1.05;\">Gestion de projet<\u002Fdiv>\n        <p style=\"margin:0; font-size:15px; line-height:1.6; color:rgba(13,27,61,0.68); flex:1;\">Pilotage, conduite du changement, structuration d'équipes et de processus dans des contextes contraints.<\u002Fp>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; color:rgba(13,27,61,0.5); border-top:1.5px solid rgba(13,27,61,0.16); padding-top:10px;\">7 × 3h30<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:{{ accent }}; color:#F2EBE0; padding:30px; display:flex; flex-direction:column; justify-content:space-between; gap:16px;\">\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.85;\">Depuis 2015<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display', Georgia, serif; font-size:30px; line-height:1.05;\">Formateur et enseignant vacataire — BTS, licence, mastère.<\u002Fdiv>\n        <div style=\"font-family:'Space Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.85;\">★ Pédagogie hors les murs<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" style=\"padding:clamp(64px,7vw,104px) 28px clamp(48px,5vw,72px);\">\n  <div style=\"max-width:1280px; margin:0 auto; background:#0D1B3D; color:#F2EBE0; padding:clamp(34px,4.6vw,64px); display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:clamp(28px,4vw,56px); align-items:center;\">\n    <div>\n      <div style=\"font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.2em; text-transform:uppercase; color:#C8F03A;\">Contact<\u002Fdiv>\n      <h2 style=\"margin:12px 0 0; font-family:'DM Serif Display', Georgia, serif; font-weight:400; font-size:clamp(38px,5vw,68px); line-height:0.9; letter-spacing:-0.03em;\">Pierre <em>Bannwarth<\u002Fem><span style=\"color:{{ accent }};\">.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:16px 0 0; font-size:17px; line-height:1.6; opacity:0.75; max-width:44ch;\">Manager ESS, formateur, auteur. Une seule porte d'entrée : l'e-mail. Les échanges sérieux commencent par un message écrit.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <a href=\"#\" ref=\"{{ mailRef }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; background:{{ accent }}; color:#F2EBE0; padding:26px 28px;\" style-hover=\"background:#C8F03A; color:#0D1B3D;\">\n        <span style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.8;\">E-mail<\u002Fspan>\n          <span style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(22px,2.4vw,30px); line-height:1;\" ref=\"{{ mailTextRef }}\">écrire un message<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:26px; line-height:1;\">↗<\u002Fspan>\n      <\u002Fa>\n      <a href=\"https://autonomie-digitale.fr\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:2px; display:flex; align-items:center; justify-content:space-between; gap:20px; border:2px solid rgba(242,235,224,0.3); color:#F2EBE0; padding:26px 28px;\" style-hover=\"border-color:#C8F03A;\">\n        <span style=\"display:flex; flex-direction:column; gap:6px;\">\n          <span style=\"font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.6;\">La tribune<\u002Fspan>\n          <span style=\"font-family:'DM Serif Display', Georgia, serif; font-size:clamp(22px,2.4vw,30px); line-height:1;\">autonomie-digitale.fr<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:26px; line-height:1;\">↗<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:3px solid #0D1B3D; padding:26px 28px 40px;\">\n  <div style=\"max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; font-family:'Space Mono', monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(13,27,61,0.55);\">\n    <span>© 2026 Pierre Bannwarth<\u002Fspan>\n    <span>★ Tribune personnelle — aucun lien avec un employeur<\u002Fspan>\n    <span>autonomie-digitale.fr<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF4A2B&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FF4A2B&quot;,&quot;#D93A1C&quot;,&quot;#0D1B3D&quot;],&quot;section&quot;:&quot;Charte&quot;},&quot;showTicker&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showArticles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showPortrait&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nconst DOMAINS = [\n  {\n    key: 'donnees', label: 'Données & vie privée',\n    quote: '« La vie privée n\\u2019est pas un luxe de technophile : c\\u2019est une condition d\\u2019autonomie individuelle, organisationnelle et démocratique. »',\n    body: 'Souveraineté numérique, données personnelles, droits fondamentaux. Ce que les organisations confient sans le savoir, à qui, et sous quelles conditions juridiques réelles.',\n    bullets: ['Lire les CGU avant de confier des données sensibles.', 'Privilégier un hébergement européen quand c\\u2019est possible.', 'Documenter ses choix : c\\u2019est une obligation, pas une option.']\n  },\n  {\n    key: 'ia', label: 'Intelligence artificielle',\n    quote: '« L\\u2019IA exige discernement, règles de confidentialité et contrôle humain. Elle libère certains profils et en fragilise d\\u2019autres. »',\n    body: 'Usages réels, dépendances créées, effets sur les métiers et les collectifs de travail. Ni révolution totale, ni destruction de l\\u2019emploi : des déplacements concrets, observables.',\n    bullets: ['Définir ce qui ne sort jamais de l\\u2019organisation.', 'Nommer un responsable humain sur chaque usage.', 'Former les profils fragilisés avant de déployer l\\u2019outil.']\n  },\n  {\n    key: 'organisations', label: 'Organisations & ESS',\n    quote: '« Le secteur associatif a de vraies forces et de vraies contradictions. Nommer les secondes n\\u2019est pas une trahison — c\\u2019est une marque de respect. »',\n    body: 'Gouvernance associative, insertion par l\\u2019activité économique, modèles économiques, rapports entre projet politique et contrainte gestionnaire.',\n    bullets: ['Clarifier qui décide quoi, par écrit.', 'Distinguer le débat de projet du débat budgétaire.', 'Mesurer l\\u2019impact social avec des indicateurs tenus dans la durée.']\n  },\n  {\n    key: 'argent', label: 'Argent',\n    quote: '« L\\u2019argent devient un logiciel. Ce qui se décide dans ses règles techniques se décidait hier dans la loi — sans le même débat. »',\n    body: 'Paiement, monnaie numérique publique, traçabilité des transactions, vie privée financière. Ce que les infrastructures de paiement enregistrent, qui y accède, et ce que cela change pour une organisation comme pour un particulier.',\n    bullets: ['Distinguer ce qui relève de la fraude de ce qui relève de la surveillance.', 'Lire ce que le prestataire de paiement conserve, et combien de temps.', 'Garder plusieurs moyens de paiement : la redondance est une protection.']\n  },\n  {\n    key: 'durable', label: 'Numérique durable',\n    quote: '« L\\u2019écologie qui interdit sans stratégie fabrique de la dépendance, pas de la sobriété. »',\n    body: 'Empreinte réelle des usages, durée de vie du matériel, reconditionnement, arbitrages entre performance, coût et impact.',\n    bullets: ['Allonger la durée de vie avant de remplacer.', 'Chiffrer l\\u2019impact avant d\\u2019interdire un usage.', 'Prévoir l\\u2019alternative en même temps que la contrainte.']\n  },\n  {\n    key: 'transformation', label: 'Transformation',\n    quote: '« Les organisations qui échouent leur transformation numérique ne manquent pas d\\u2019outils. Elles manquent de lucidité sur ce que les outils produisent. »',\n    body: 'Conduite du changement réelle : déploiement de logiciels métier, appropriation par les équipes, résistances légitimes, plans de formation qui tiennent.',\n    bullets: ['Partir des usages existants, pas du cahier des charges.', 'Former par profil, jamais en session unique.', 'Accepter que l\\u2019appropriation prenne le temps qu\\u2019elle prend.']\n  }\n];\n\nconst TIMELINE = [\n  { year: '2025 →', cat: 'Direction', role: 'Coordinateur — ateliers et chantiers d\\u2019insertion', org: 'Réseau national de solidarité · IAE', body: 'Coordination et pilotage de cinq chantiers d\\u2019insertion : confiture, logistique, maraîchage, second œuvre du bâtiment, reconditionnement d\\u2019ordinateurs. Suivi opérationnel, administratif et budgétaire, encadrement des équipes, outils de pilotage, partenariats vers l\\u2019emploi durable.' },\n  { year: '2022 →', cat: 'Transmission', role: 'Formateur, enseignant vacataire et auteur', org: 'Activité indépendante', body: 'Interventions en enseignement supérieur du bachelor au mastère : ESS, urbanisme durable, gestion de projet, vie privée et technologie. Depuis, écriture d\\u2019Autonomie Digitale, tribune indépendante sur le numérique.' },\n  { year: '2020 – 2022', cat: 'Direction', role: 'Chef de service — Entraide', org: 'Association de solidarité', body: 'Management d\\u2019équipe, mise en œuvre du projet d\\u2019établissement, animation collective dans un cadre associatif exigeant.' },\n  { year: '2017 – 2020', cat: 'Transformation', role: 'Chargé de mission — déploiement d\\u2019un progiciel métier', org: 'Association médico-sociale · 800 salariés', body: 'Pilotage complet du déploiement sur l\\u2019ensemble des établissements. Création et mise en œuvre du plan de formation, adapté à chaque profil professionnel. Sécurité des données et conformité RGPD.' },\n  { year: '2015 – 2016', cat: 'Transformation', role: 'Consultant — conduite du changement', org: 'Missions indépendantes', body: 'Développement du mécénat pour une association sportive. Conduite du changement en association de solidarité. Conseil en organisation dans une PME industrielle (RH, finances, processus).' },\n  { year: '2011 – 2014', cat: 'Direction', role: 'Directeur — éducation à l\\u2019environnement urbain', org: 'Association CPIE · 14 salariés · 450 K€', body: 'Gestion administrative et financière, animation d\\u2019équipe, conception et pilotage de projets, partenariats institutionnels.' },\n  { year: '2009 – 2011', cat: 'Direction', role: 'Directeur — environnement et hébergement', org: 'Association CPIE · 20 salariés · 750 K€', body: 'Direction d\\u2019un organisme d\\u2019environnement, d\\u2019hébergement et d\\u2019éducation populaire, incluant la gestion d\\u2019une situation de crise financière et de sa procédure judiciaire.' },\n  { year: '2006 – 2008', cat: 'Transmission', role: 'Double formation supérieure', org: 'Master · Master · Licence professionnelle', body: 'Master 2 « Entrepreneuriat des projets socio-économiques ». Master 1 « Qualité et gestion de l\\u2019environnement ». Licence professionnelle « Management des organisations ».' }\n];\n\nconst FILTERS = ['Tout', 'Direction', 'Transmission', 'Transformation'];\n\nclass Component extends DCLogic {\n  state = { domain: 'donnees', filter: 'Tout' };\n  progressRef = React.createRef();\n  navRef = React.createRef();\n  mailRef = React.createRef();\n  mailTextRef = React.createRef();\n\n  componentDidMount() {\n    const accent = this.props.accentColor || '#FF4A2B';\n\n    const mail = this.mailRef.current;\n    if (mail) {\n      const addr = ['bannwarth.pierre', 'protonmail.ch'].join('@');\n      mail.setAttribute('href', 'mailto:' + addr);\n      if (this.mailTextRef.current) this.mailTextRef.current.textContent = addr;\n    }\n\n    const bar = this.progressRef.current;\n    let ticking = false;\n    this._onScroll = () => {\n      if (ticking) return;\n      ticking = true;\n      requestAnimationFrame(() => {\n        ticking = false;\n        const h = document.documentElement.scrollHeight - window.innerHeight;\n        if (bar) bar.style.width = (h > 0 ? Math.min(1, window.scrollY / h) * 100 : 0) + '%';\n        const nav = this.navRef.current;\n        const links = nav ? Array.from(nav.querySelectorAll('a[href^=\"#\"]')) : [];\n        let currentId = null;\n        links.forEach(l => {\n          const sec = document.querySelector(l.getAttribute('href'));\n          if (sec && sec.getBoundingClientRect().top <= 140) currentId = l.getAttribute('href');\n        });\n        links.forEach(l => {\n          if (l.getAttribute('href') === '#contact') return;\n          l.style.borderBottomColor = l.getAttribute('href') === currentId ? accent : 'transparent';\n        });\n      });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n\n    const reveal = el => { el.style.opacity = '1'; el.style.transform = 'none'; };\n    const nodes = Array.from(document.querySelectorAll('[data-rv]'));\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e, i) => {\n          if (!e.isIntersecting) return;\n          setTimeout(() => reveal(e.target), i * 70);\n          io.unobserve(e.target);\n        });\n      }, { rootMargin: '0px 0px -8% 0px' });\n      nodes.forEach(n => io.observe(n));\n      this._io = io;\n    } else nodes.forEach(reveal);\n    this._safety = setTimeout(() => nodes.forEach(reveal), 3000);\n\n    const counters = Array.from(document.querySelectorAll('[data-count]'));\n    counters.forEach(el => {\n      const target = parseInt(el.getAttribute('data-count'), 10);\n      const suffix = el.getAttribute('data-suffix') || '';\n      const start = performance.now();\n      const dur = 1400;\n      const step = now => {\n        const p = Math.min(1, (now - start) / dur);\n        const eased = 1 - Math.pow(1 - p, 3);\n        el.textContent = Math.round(target * eased) + (p === 1 ? suffix : '');\n        if (p < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._io) this._io.disconnect();\n    clearTimeout(this._safety);\n  }\n\n  renderVals() {\n    const accent = this.props.accentColor || '#FF4A2B';\n    const active = DOMAINS.find(d => d.key === this.state.domain) || DOMAINS[0];\n    const activeIdx = DOMAINS.indexOf(active) + 1;\n\n    const tab = on => 'font-family:\\'Space Mono\\', monospace; font-size:11.5px; letter-spacing:0.12em; text-transform:uppercase; padding:11px 16px; cursor:pointer; border:2px solid #0D1B3D; transition:background .2s ease, color .2s ease; background:' + (on ? '#0D1B3D' : 'transparent') + '; color:' + (on ? '#F2EBE0' : '#0D1B3D') + ';';\n\n    const chip = on => 'font-family:\\'Space Mono\\', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; padding:9px 15px; cursor:pointer; border:1.5px solid #0D1B3D; transition:background .2s ease, color .2s ease; background:' + (on ? accent : 'transparent') + '; color:' + (on ? '#F2EBE0' : '#0D1B3D') + '; border-color:' + (on ? accent : '#0D1B3D') + ';';\n\n    const catColor = { Direction: accent, Transmission: '#0D1B3D', Transformation: 'rgba(13,27,61,0.5)' };\n\n    return {\n      accent,\n      progressRef: this.progressRef,\n      navRef: this.navRef,\n      mailRef: this.mailRef,\n      mailTextRef: this.mailTextRef,\n      today: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }),\n      showTicker: this.props.showTicker ?? true,\n      showArticles: this.props.showArticles ?? true,\n      showPortrait: this.props.showPortrait ?? true,\n      domains: DOMAINS.map(d => ({\n        label: d.label,\n        tabStyle: tab(d.key === this.state.domain),\n        select: () => this.setState({ domain: d.key })\n      })),\n      activeLabel: active.label,\n      activeQuote: active.quote,\n      activeBody: active.body,\n      activeBullets: active.bullets,\n      activeIndex: '0' + activeIdx,\n      filters: FILTERS.map(f => ({\n        label: f,\n        style: chip(f === this.state.filter),\n        select: () => this.setState({ filter: f })\n      })),\n      timeline: TIMELINE.filter(t => this.state.filter === 'Tout' || t.cat === this.state.filter).map(t => ({\n        year: t.year, cat: t.cat, role: t.role, org: t.org, body: t.body,\n        tagStyle: 'font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:' + (catColor[t.cat] || accent) + ';'\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
